name: CI

# Runs on every push and PR. No deploy step — that stays manual via
# `pnpm run deploy` so we don't accidentally ship from a half-reviewed
# branch. The point here is just a safety net: catch broken tests, lint
# regressions, and TypeScript errors before they land on main.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Opt JS-based actions onto Node 24 now, ahead of the June 2026 forced switch.
# Drops the "Node.js 20 actions are deprecated" warning on every run.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # Match the version used locally (engineers and CI on the same
          # major makes "works on my machine" lies less likely).
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm lint

      # `next build` runs typecheck + bundle. Skip the OpenNext +
      # Cloudflare deploy paths — those are validated at deploy time.
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Playwright bundles its own browsers; cache them so we don't redownload
      # ~120MB on every run. Key on the @playwright/test version so a bump
      # invalidates the cache.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` applies migrations from supabase/migrations/ and
      # boots Postgres + GoTrue + the rest of the local stack.
      - run: supabase start

      - name: Export Supabase env vars
        run: |
          status=$(supabase status -o json)
          echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$status" | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$status" | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status" | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      - run: pnpm test:e2e

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          # Successful runs may not produce a report or trace; don't warn then.
          if-no-files-found: ignore
